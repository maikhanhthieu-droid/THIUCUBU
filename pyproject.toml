[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
exclude = ["data", ".git", ".venv"]

[tool.ruff.lint]
# Start with correctness rules; formatting/style can be adopted separately
# without mixing a repository-wide rewrite into scoring v2.
select = ["E9", "F63", "F7", "F82"]
