name: THIEUCUBU Weekend Opportunities

permissions:
  contents: write

concurrency:
  group: thieucutoo-weekend-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "30 1 * * 6"
    - cron: "30 7 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "full | test"
        required: false
        default: "full"

jobs:
  weekend-opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        env:
          FIINQUANT_CONFIGURED: ${{ secrets.FIINQUANT_USERNAME != '' && secrets.FIINQUANT_PASSWORD != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt
          if [ "$FIINQUANT_CONFIGURED" = "true" ]; then
            python -m pip install --disable-pip-version-check -r requirements-fiinquant.txt
            python -m pip install --disable-pip-version-check --no-deps --extra-index-url https://fiinquant.github.io/fiinquantx/simple fiinquantx==0.1.67
          else
            echo "FiinQuant Secrets are not configured; weekend scanner will use fallback sources."
          fi

      - name: Resolve cache date
        id: cache-date
        run: echo "date=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: weekend-cache-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            weekend-cache-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-
            weekend-cache-${{ runner.os }}-
            scan-cache-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-
            scan-cache-${{ runner.os }}-

      - name: Run weekend opportunity scanner
        id: weekend-scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          FIINQUANT_USERNAME: ${{ secrets.FIINQUANT_USERNAME }}
          FIINQUANT_PASSWORD: ${{ secrets.FIINQUANT_PASSWORD }}
          WEEKEND_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          WEEKEND_TOP_N: "20"
          WEEKEND_CONVICTION_LIMIT: "2"
          WEEKEND_HISTORY_BARS: "780"
          WEEKEND_MIN_SCORE: "60"
          WEEKEND_MIN_SECTOR_SCORE: "52"
          WEEKEND_MIN_OWN_HISTORY_OBSERVATIONS: "4"
          WEEKEND_MAX_WORKERS: "3"
          WEEKEND_RANDOM_START_MAX_SEC: "600"
          WEEKEND_FUNDAMENTAL_REQUESTS_PER_MINUTE: "15"
          WEEKEND_FUNDAMENTAL_USAGE_RATIO: "0.80"
          WEEKEND_FUNDAMENTAL_DELAY_MIN_SEC: "0.4"
          WEEKEND_FUNDAMENTAL_DELAY_MAX_SEC: "1.4"
          WEEKEND_UPDATE_NEAR_HIGH: "1"
          WEEKEND_NEAR_HIGH_LOOKBACK_BARS: "1560"
          WEEKEND_NEAR_HIGH_THRESHOLD_PCT: "7"
          SCAN_MAX_WORKERS: "3"
          SCAN_API_SOURCES: "FIINQUANT,VCI,KBS,DNSE"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "15"
          SCAN_SOURCE_LIMITS: "FIINQUANT=80,VCI=20,KBS=20,DNSE=15"
          FIINQUANT_REQUESTS_PER_MINUTE: "80"
          FIINQUANT_USAGE_RATIO: "0.75"
          # The free FiinQuant plan allows one maximum connection.
          FIINQUANT_MAX_CONCURRENCY: "1"
          SCAN_SOURCE_USAGE_RATIO: "0.78"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.4"
          SCAN_REQUEST_JITTER_MAX_SEC: "1.8"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "30"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "90"
          SCAN_SOURCE_DISABLE_AFTER_FAILURES: "3"
          SCAN_SOURCE_RECOVER_AFTER_SEC: "300"
          SCAN_RETRY_AFTER_MAX_SEC: "300"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_STALE_CACHE_MAX_DAYS: "7"
          MARKET_CLOSED_POLICY: "scan_old"
          MARKET_ACTIVITY_PROBE_ACTION: "warn"
          DRY_RUN: "0"
        run: |
          python weekend_plus_safe.py --mode "$WEEKEND_MODE"
          if [ "$WEEKEND_MODE" != "test" ]; then
            python near_high_filter.py --mode full
          fi

      - name: Run optional VIMO weekend support
        if: steps.weekend-scanner.outcome == 'success'
        continue-on-error: true
        env:
          VIMO_API_KEY: ${{ secrets.VIMO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIMO_REQUESTS_PER_MINUTE: "20"
          VIMO_USAGE_RATIO: "0.75"
          VIMO_MAX_WORKERS: "2"
          VIMO_WEEKEND_MAX_SYMBOLS: "12"
        run: |
          if [ -z "$VIMO_API_KEY" ]; then
            echo "VIMO_API_KEY is not configured; optional weekend support skipped."
            exit 0
          fi
          python vimo_support.py --mode weekend

      - name: Upload weekend data artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thieucutoo-weekend-${{ github.run_number }}
          path: |
            data/weekend_opportunities_latest.json
            data/filter_feed_latest.json
            data/weekend_opportunities_history.json
            data/candidate_book_latest.json
            data/investment_theses.json
            data/fundamental_history.json
            data/signal_tracker.json
            data/near_high_skiplist.json
            data/run_journal.json
            data/source_health.json
            data/source_routing.json
            data/market_breadth_history.json
            data/market_systemic_state.json
            data/sector_rotation_history.json
          retention-days: 60

      - name: Commit weekend data
        if: always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'test')
        run: |
          python scripts/safe_commit_data.py \
            --message "chore: update weekend opportunities [skip ci]" \
            --paths \
            data/weekend_opportunities_latest.json \
            data/filter_feed_latest.json \
            data/weekend_opportunities_history.json \
            data/candidate_book_latest.json \
            data/investment_theses.json \
            data/fundamental_history.json \
            data/signal_tracker.json \
            data/near_high_skiplist.json \
            data/run_journal.json \
            data/source_health.json \
            data/source_routing.json

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; cannot send failure notice."
            exit 0
          fi
          TEXT="THIEUCUBU weekend workflow failed: ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
