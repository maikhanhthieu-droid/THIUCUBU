name: THIEUCUBU Scanner

permissions:
  contents: write
  actions: read

concurrency:
  # Keep fixed scanner backups from running at the same time. Pulse has its own
  # independent group and files, so a Pulse failure never blocks this workflow.
  group: thieucutoo-scanner-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scanner.yml"
  schedule:
    # Start a little early; the runner waits inside session_gate.py for the exact Vietnam-time data windows.
    # Keep this workflow file touched without skip-ci when schedules need to be re-registered by GitHub.
    - cron: "25 3 * * 1-5" # morning backup 10:25 VN, code waits until 10:31
    - cron: "31 3 * * 1-5" # morning primary 10:31 VN
    - cron: "36 3 * * 1-5" # morning backup if GitHub queue skips/delays primary
    - cron: "43 3 * * 1-5" # morning final backup
    - cron: "25 6 * * 1-5" # afternoon backup 13:25 VN, code waits until 13:31
    - cron: "31 6 * * 1-5" # afternoon primary 13:31 VN
    - cron: "36 6 * * 1-5" # afternoon backup if GitHub queue skips/delays primary
    - cron: "43 6 * * 1-5" # afternoon final backup before 14:00 focus
    - cron: "0 8 * * 1-5"  # eod primary 15:00 VN, code waits until 15:05
    - cron: "10 8 * * 1-5" # eod backup
    - cron: "25 8 * * 1-5" # eod final backup
  workflow_dispatch:
    inputs:
      mode:
        description: "test | morning_focus | morning_broad | afternoon_focus | afternoon_split | eod | auto"
        required: false
        default: "test"

jobs:
  scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Schedule duplicate guard
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE="auto"
          case "$SCAN_SCHEDULE" in
            "25 3 * * 1-5"|"31 3 * * 1-5"|"36 3 * * 1-5"|"43 3 * * 1-5") MODE="morning_broad" ;;
            "25 6 * * 1-5"|"31 6 * * 1-5"|"36 6 * * 1-5"|"43 6 * * 1-5") MODE="afternoon_split" ;;
            "0 8 * * 1-5"|"10 8 * * 1-5"|"25 8 * * 1-5") MODE="eod" ;;
          esac
          if [ "$MODE" = "auto" ]; then
            NOW_VN="$(TZ=Asia/Ho_Chi_Minh date +%H%M)"
            NOW_VN_NUM=$((10#$NOW_VN))
            if [ "$NOW_VN_NUM" -ge 930 ] && [ "$NOW_VN_NUM" -le 1230 ]; then
              MODE="morning_broad"
            elif [ "$NOW_VN_NUM" -ge 1325 ] && [ "$NOW_VN_NUM" -lt 1500 ]; then
              MODE="afternoon_split"
            elif [ "$NOW_VN_NUM" -ge 1500 ] && [ "$NOW_VN_NUM" -le 2100 ]; then
              MODE="eod"
            fi
          fi
          WINDOW_MINUTES=25
          if [ "$MODE" = "morning_broad" ]; then WINDOW_MINUTES=25; fi
          if [ "$MODE" = "afternoon_split" ]; then WINDOW_MINUTES=20; fi
          if [ "$MODE" = "eod" ]; then WINDOW_MINUTES=35; fi
          ACTIVE_GRACE_MINUTES=12
          if [ "$MODE" = "morning_broad" ]; then ACTIVE_GRACE_MINUTES=55; fi
          if [ "$MODE" = "afternoon_split" ]; then ACTIVE_GRACE_MINUTES=55; fi
          if [ "$MODE" = "eod" ]; then ACTIVE_GRACE_MINUTES=25; fi
          REPORT_FILE="$RUNNER_TEMP/session_alerts_latest.json"
          if ! gh api "repos/${{ github.repository }}/contents/data/session_alerts_latest.json?ref=${{ github.ref_name }}" --jq '.content' 2>/dev/null | base64 -d > "$REPORT_FILE"; then
            echo '{}' > "$REPORT_FILE"
          fi
          REPORT_FRESH="$(REPORT_FILE="$REPORT_FILE" MODE="$MODE" python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          vn_tz = timezone(timedelta(hours=7))
          aliases = {
              "morning_broad": {"morning", "morning_broad"},
              "afternoon_split": {"afternoon", "afternoon_split"},
              "eod": {"eod"},
          }
          try:
              with open(os.environ["REPORT_FILE"], encoding="utf-8") as handle:
                  report = json.load(handle)
              updated_raw = str(report.get("updated_at") or "")
              updated = datetime.fromisoformat(updated_raw.replace("Z", "+00:00"))
              if updated.tzinfo is None:
                  updated = updated.replace(tzinfo=timezone.utc)
              mode = os.environ.get("MODE", "")
              mode_ok = str(report.get("mode") or "") in aliases.get(mode, {mode})
              same_vn_day = updated.astimezone(vn_tz).date() == datetime.now(vn_tz).date()
              print("true" if mode_ok and same_vn_day else "false")
          except Exception:
              print("false")
          PY
          )"
          if [ "$REPORT_FRESH" = "true" ]; then
            echo "Fresh $MODE report already exists in data/session_alerts_latest.json; this backup schedule will skip."
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUNS_FILE="$RUNNER_TEMP/scanner_runs.json"
          gh run list -R "${{ github.repository }}" --workflow scanner.yml --limit 30 --json databaseId,status,conclusion,createdAt,event > "$RUNS_FILE"
          SHOULD_RUN="$(RUNS_FILE="$RUNS_FILE" CURRENT_RUN_ID="$GITHUB_RUN_ID" ACTIVE_GRACE_MINUTES="$ACTIVE_GRACE_MINUTES" python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone

          with open(os.environ["RUNS_FILE"], encoding="utf-8") as handle:
              runs = json.load(handle)
          current = int(os.environ["CURRENT_RUN_ID"])
          active_cutoff = datetime.now(timezone.utc) - timedelta(minutes=int(os.environ["ACTIVE_GRACE_MINUTES"]))
          should_run = True
          for run in runs:
              if int(run.get("databaseId") or 0) == current:
                  continue
              if run.get("event") not in {"schedule", "workflow_dispatch"}:
                  continue
              created = datetime.fromisoformat(str(run["createdAt"]).replace("Z", "+00:00"))
              status = run.get("status")
              if created >= active_cutoff and status in {"queued", "in_progress", "waiting", "requested"}:
                  should_run = False
                  break
          print("true" if should_run else "false")
          PY
          )"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Recent scanner run is still active; this backup schedule will skip."
          fi

      - name: Setup Python
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          # FiinQuantX 0.1.67 uses PEP 701 f-strings and requires Python 3.12+.
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        env:
          FIINQUANT_CONFIGURED: ${{ secrets.FIINQUANT_USERNAME != '' && secrets.FIINQUANT_PASSWORD != '' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt
          if [ "$FIINQUANT_CONFIGURED" = "true" ]; then
            python -m pip install --disable-pip-version-check -r requirements-fiinquant.txt
            python -m pip install --disable-pip-version-check --no-deps --extra-index-url https://fiinquant.github.io/fiinquantx/simple fiinquantx==0.1.67
          else
            echo "FiinQuant Secrets are not configured; scanner will use fallback sources."
          fi

      - name: Resolve cache date
        id: cache-date
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        run: echo "date=$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore cache
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: data/cache
          key: scan-cache-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            scan-cache-${{ runner.os }}-${{ steps.cache-date.outputs.date }}-
            scan-cache-${{ runner.os }}-

      - name: Run scanner
        id: scanner
        if: github.event_name != 'schedule' || steps.guard.outputs.run == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          FIINQUANT_USERNAME: ${{ secrets.FIINQUANT_USERNAME }}
          FIINQUANT_PASSWORD: ${{ secrets.FIINQUANT_PASSWORD }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_EVENT_NAME: ${{ github.event_name }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
          SCAN_BATCH_SIZE: "12"
          SCAN_MAX_WORKERS: "3"
          SCAN_API_SOURCES: "FIINQUANT,VCI,KBS,DNSE"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "15"
          SCAN_SOURCE_LIMITS: "FIINQUANT=80,VCI=20,KBS=20,DNSE=15"
          FIINQUANT_REQUESTS_PER_MINUTE: "80"
          FIINQUANT_USAGE_RATIO: "0.75"
          # The free FiinQuant plan allows one maximum connection.
          FIINQUANT_MAX_CONCURRENCY: "1"
          SCAN_SOURCE_USAGE_RATIO: "0.78"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.3"
          SCAN_REQUEST_JITTER_MAX_SEC: "1.5"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "30"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "90"
          SCAN_SOURCE_DISABLE_AFTER_FAILURES: "3"
          SCAN_SOURCE_RECOVER_AFTER_SEC: "300"
          SCAN_RETRY_AFTER_MAX_SEC: "300"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_STALE_CACHE_MAX_DAYS: "3"
          SCAN_HISTORY_BARS: "520"
          SCAN_DELAY_MIN_SEC: "1"
          SCAN_DELAY_MAX_SEC: "4"
          SESSION_RANDOM_START_MAX_SEC: "45"
          SESSION_DATA_JITTER_MAX_SEC: "60"
          SESSION_FOCUS_LIMIT: "28"
          SESSION_QUICK_LIMIT: "50"
          SESSION_QUICK_SIGNAL_LIMIT: "38"
          SESSION_QUICK_NOTE_LIMIT: "12"
          SCAN_ROTATING_UNIVERSE_SIZE: "36"
          SCAN_SYMBOL_TIMEOUT_SEC: "90"
          SCAN_RETRY_FAILED_DELAY_MIN_SEC: "20"
          SCAN_RETRY_FAILED_DELAY_MAX_SEC: "60"
          SCAN_RETRY_FAILED_MAX_SYMBOLS: "24"
          SCAN_SKIP_NEAR_HIGH_WEEKDAY: "0" # deprecated: near-high is now a soft warning tag
          MARKET_CLOSED_POLICY: "scan_old"
          MARKET_ACTIVITY_PROBE_ENABLED: "1"
          MARKET_ACTIVITY_PROBE_ACTION: "warn"
          MARKET_PROBE_SAMPLE_SIZE: "38"
          MARKET_PROBE_MIN_CHECKED: "24"
          MARKET_PROBE_UNCHANGED_RATIO: "0.85"
          MARKET_PROBE_OLD_DATE_RATIO: "0.80"
          MARKET_PROBE_ZERO_VOLUME_RATIO: "0.80"
          DRY_RUN: "0"
        run: |
          MODE="$SCAN_MODE"
          if [ "$SCAN_EVENT_NAME" = "push" ] && [ "$MODE" = "auto" ]; then
            echo "Workflow file push only refreshes GitHub schedule registration; scanner is skipped."
            exit 0
          fi
          if [ "$MODE" = "auto" ]; then
            case "$SCAN_SCHEDULE" in
              "25 3 * * 1-5") MODE="morning_broad" ;;
              "31 3 * * 1-5") MODE="morning_broad" ;;
              "36 3 * * 1-5") MODE="morning_broad" ;;
              "43 3 * * 1-5") MODE="morning_broad" ;;
              "25 6 * * 1-5") MODE="afternoon_split" ;;
              "31 6 * * 1-5") MODE="afternoon_split" ;;
              "36 6 * * 1-5") MODE="afternoon_split" ;;
              "43 6 * * 1-5") MODE="afternoon_split" ;;
              "0 8 * * 1-5") MODE="eod" ;;
              "10 8 * * 1-5") MODE="eod" ;;
              "25 8 * * 1-5") MODE="eod" ;;
            esac
          fi
          if [ "$MODE" = "auto" ] && [ "$SCAN_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="test"
          fi
          if [ "$MODE" = "afternoon_split" ]; then
            export SESSION_FOCUS_LIMIT="28"
          fi
          echo "Running scanner mode=$MODE schedule=$SCAN_SCHEDULE"
          if [ "$SCAN_EVENT_NAME" = "schedule" ]; then
            NOW_VN="$(TZ=Asia/Ho_Chi_Minh date +%H%M)"
            NOW_VN_NUM=$((10#$NOW_VN))
            LIVE_MODE=""
            if [ "$NOW_VN_NUM" -ge 930 ] && [ "$NOW_VN_NUM" -le 1230 ]; then
              LIVE_MODE="morning_broad"
            elif [ "$NOW_VN_NUM" -ge 1325 ] && [ "$NOW_VN_NUM" -lt 1500 ]; then
              LIVE_MODE="afternoon_split"
            elif [ "$NOW_VN_NUM" -ge 1500 ] && [ "$NOW_VN_NUM" -le 2100 ]; then
              LIVE_MODE="eod"
            fi
            if [ -z "$LIVE_MODE" ]; then
              echo "Skip schedule at VN time $NOW_VN because market/report window is closed."
              exit 0
            fi
            if [ "$MODE" != "$LIVE_MODE" ]; then
              echo "Remap stale schedule mode=$MODE to live mode=$LIVE_MODE at VN time $NOW_VN."
              MODE="$LIVE_MODE"
            fi
          fi
          TIMEOUT_MIN="170"
          case "$MODE" in
            "test") TIMEOUT_MIN="20" ;;
            "morning_focus"|"afternoon_focus") TIMEOUT_MIN="25" ;;
            "morning_broad") TIMEOUT_MIN="55" ;;
            "afternoon_split"|"afternoon_broad") TIMEOUT_MIN="50" ;;
            "eod") TIMEOUT_MIN="160" ;;
          esac
          echo "Scanner hard timeout ${TIMEOUT_MIN}m for mode=$MODE"
          timeout --kill-after=120s "${TIMEOUT_MIN}m" python session_gate_near_high.py --mode "$MODE"

      - name: Run optional VIMO support
        if: steps.scanner.outcome == 'success'
        continue-on-error: true
        env:
          VIMO_API_KEY: ${{ secrets.VIMO_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VIMO_REQUESTS_PER_MINUTE: "20"
          VIMO_USAGE_RATIO: "0.75"
          VIMO_MAX_WORKERS: "2"
          VIMO_DAILY_MAX_SYMBOLS: "8"
        run: |
          if [ -z "$VIMO_API_KEY" ]; then
            echo "VIMO_API_KEY is not configured; optional support flow skipped."
            exit 0
          fi
          python vimo_support.py --mode daily

      - name: Upload data artifact
        if: always() && (github.event_name != 'schedule' || steps.guard.outputs.run == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
            data/session_alerts_latest.json
            data/filter_feed_latest.json
            data/stock_features_latest.json
            data/universe_state.json
            data/run_journal.json
            data/source_health.json
            data/source_routing.json
            data/memory_state.json
            data/market_probe_state.json
            data/market_holidays.json
            data/signal_tracker.json
            data/sector_rotation_history.json
            data/market_breadth_history.json
            data/market_systemic_state.json
            data/portfolio_threshold_state.json
            data/near_high_skiplist.json
            data/market_state_history.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'test') && (github.event_name != 'schedule' || steps.guard.outputs.run == 'true')
        run: |
          python scripts/safe_commit_data.py \
            --message "chore: update scanner data [skip ci]" \
            --paths \
            data/results_latest.json \
            data/session_alerts_latest.json \
            data/filter_feed_latest.json \
            data/stock_features_latest.json \
            data/universe_state.json \
            data/run_journal.json \
            data/source_health.json \
            data/source_routing.json \
            data/memory_state.json \
            data/market_probe_state.json \
            data/market_holidays.json \
            data/historical_peaks.json \
            data/failed_breaks.json \
            data/signal_tracker.json \
            data/sector_rotation_history.json \
            data/market_breadth_history.json \
            data/market_systemic_state.json \
            data/portfolio_threshold_state.json \
            data/near_high_skiplist.json \
            data/market_state_history.json \
            data/notes.json \
            data/portfolio.json

      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured; cannot send failure notice."
            exit 0
          fi
          TEXT="THIEUCUBU workflow failed: ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} - ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
