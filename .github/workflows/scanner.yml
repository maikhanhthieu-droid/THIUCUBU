name: Thieucutoo Scanner

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: thieucutoo-scanner-${{ github.ref }}-${{ github.event.schedule || github.event.inputs.mode || 'manual' }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scanner.yml"
  schedule:
    # Start a little early; the runner waits inside session_gate.py for the exact Vietnam-time data windows.
    - cron: "31 3 * * 1-5" # morning focus: <=40 note/strong/near-break symbols, cancel after 20m
    - cron: "16 4 * * 1-5" # morning broad: full scan from 11:16 VN
    - cron: "31 6 * * 1-5" # afternoon focus: <=40 note/strong/near-break symbols, cancel after 20m
    - cron: "1 7 * * 1-5"  # afternoon broad: full scan from 14:01 VN
    - cron: "0 8 * * 1-5"  # eod: wait for 15:05 VN data
  workflow_dispatch:
    inputs:
      mode:
        description: "test | morning_focus | morning_broad | afternoon_focus | afternoon_broad | eod | auto"
        required: false
        default: "test"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: scan-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scan-cache-${{ runner.os }}-

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_EVENT_NAME: ${{ github.event_name }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
          SCAN_BATCH_SIZE: "12"
          SCAN_MAX_WORKERS: "3"
          SCAN_API_SOURCES: "VCI,KBS,DNSE"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "15"
          SCAN_SOURCE_LIMITS: "VCI=20,KBS=20,DNSE=15"
          SCAN_SOURCE_USAGE_RATIO: "0.78"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.3"
          SCAN_REQUEST_JITTER_MAX_SEC: "1.5"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "30"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "90"
          SCAN_SOURCE_DISABLE_AFTER_FAILURES: "3"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_DELAY_MIN_SEC: "1"
          SCAN_DELAY_MAX_SEC: "4"
          SESSION_RANDOM_START_MAX_SEC: "45"
          SESSION_DATA_JITTER_MAX_SEC: "60"
          SESSION_FOCUS_LIMIT: "28"
          SESSION_QUICK_LIMIT: "40"
          SESSION_QUICK_SIGNAL_LIMIT: "30"
          SESSION_QUICK_NOTE_LIMIT: "10"
          SCAN_SKIP_NEAR_HIGH_WEEKDAY: "1"
          DRY_RUN: "0"
        run: |
          MODE="$SCAN_MODE"
          if [ "$MODE" = "auto" ]; then
            case "$SCAN_SCHEDULE" in
              "31 3 * * 1-5") MODE="morning_focus" ;;
              "16 4 * * 1-5") MODE="morning_broad" ;;
              "31 6 * * 1-5") MODE="afternoon_focus" ;;
              "1 7 * * 1-5") MODE="afternoon_broad" ;;
              "0 8 * * 1-5") MODE="eod" ;;
            esac
          fi
          if [ "$MODE" = "auto" ] && [ "$SCAN_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="test"
          fi
          if [ "$MODE" = "afternoon_broad" ]; then
            export SESSION_FOCUS_LIMIT="20"
          fi
          echo "Running scanner mode=$MODE schedule=$SCAN_SCHEDULE"
          if [ "$SCAN_EVENT_NAME" = "schedule" ]; then
            NOW_VN="$(TZ=Asia/Ho_Chi_Minh date +%H%M)"
            NOW_VN_NUM=$((10#$NOW_VN))
            skip_outside_window() {
              label="$1"
              start="$2"
              end="$3"
              note="$4"
              start_num=$((10#$start))
              end_num=$((10#$end))
              if [ "$NOW_VN_NUM" -lt "$start_num" ] || [ "$NOW_VN_NUM" -gt "$end_num" ]; then
                echo "Skip stale $label at VN time $NOW_VN; allowed ${start:0:2}:${start:2:2}-${end:0:2}:${end:2:2} VN ($note)."
                exit 0
              fi
            }
            case "$MODE" in
              morning_focus) skip_outside_window "$MODE" "1020" "1051" "protect 11:16 broad scan" ;;
              morning_broad) skip_outside_window "$MODE" "1110" "1215" "must return before 12:30" ;;
              afternoon_focus) skip_outside_window "$MODE" "1320" "1351" "protect 14:01 broad scan" ;;
              afternoon_broad) skip_outside_window "$MODE" "1355" "1412" "must return near 14:17" ;;
              eod) skip_outside_window "$MODE" "1500" "2100" "EOD window" ;;
            esac
          fi
          if [ "$MODE" = "morning_focus" ] || [ "$MODE" = "afternoon_focus" ]; then
            NOW_VN="$(TZ=Asia/Ho_Chi_Minh date +%H%M)"
            NOW_VN_NUM=$((10#$NOW_VN))
            QUICK_DEADLINE="1051"
            NEXT_MAIN="11:16"
            if [ "$MODE" = "afternoon_focus" ]; then
              QUICK_DEADLINE="1351"
              NEXT_MAIN="14:01"
            fi
            if [ "$NOW_VN_NUM" -gt "$QUICK_DEADLINE" ]; then
              echo "Skip stale $MODE at VN time $NOW_VN; next main job $NEXT_MAIN is protected."
              exit 0
            fi
            TODAY_VN="$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)"
            DEADLINE_TEXT="${QUICK_DEADLINE:0:2}:${QUICK_DEADLINE:2:2}:00"
            DEADLINE_EPOCH="$(TZ=Asia/Ho_Chi_Minh date -d "$TODAY_VN $DEADLINE_TEXT" +%s)"
            NOW_EPOCH="$(TZ=Asia/Ho_Chi_Minh date +%s)"
            QUICK_TIMEOUT_SEC=$((DEADLINE_EPOCH - NOW_EPOCH))
            if [ "$QUICK_TIMEOUT_SEC" -le 0 ]; then
              echo "Skip $MODE because quick deadline $DEADLINE_TEXT VN already passed."
              exit 0
            fi
            if [ "$QUICK_TIMEOUT_SEC" -gt 1200 ]; then
              QUICK_TIMEOUT_SEC=1200
            fi
            echo "$MODE quick timeout=${QUICK_TIMEOUT_SEC}s deadline=$DEADLINE_TEXT VN next_main=$NEXT_MAIN"
            set +e
            timeout "${QUICK_TIMEOUT_SEC}s" python session_gate_near_high.py --mode "$MODE"
            CODE=$?
            set -e
            if [ "$CODE" -eq 124 ]; then
              echo "$MODE timed out before quick deadline $DEADLINE_TEXT VN; cancelled to protect broad/EOD jobs."
              exit 0
            fi
            exit "$CODE"
          fi
          python session_gate_near_high.py --mode "$MODE"

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
            data/session_alerts_latest.json
            data/signal_tracker.json
            data/sector_rotation_history.json
            data/portfolio_threshold_state.json
            data/near_high_skiplist.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ThieucutooBot"
          git config user.email "bot@thieucutoo.local"
          git pull --rebase --autostash || true
          for path in \
            data/results_latest.json \
            data/session_alerts_latest.json \
            data/historical_peaks.json \
            data/failed_breaks.json \
            data/signal_tracker.json \
            data/sector_rotation_history.json \
            data/portfolio_threshold_state.json \
            data/near_high_skiplist.json \
            data/notes.json \
            data/portfolio.json
          do
            if [ -e "$path" ]; then
              if git check-ignore -q "$path"; then
                git add -f "$path"
              else
                git add "$path"
              fi
            fi
          done
          if git diff --staged --quiet; then
            echo "No scanner data changes."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi
