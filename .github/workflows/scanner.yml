name: Thieucutoo Scanner

permissions:
  contents: write

concurrency:
  group: thieucutoo-scanner-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # 10:35, 13:45, 15:05 Vietnam time, Monday-Friday.
    - cron: "35 3 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "5 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | morning | afternoon | eod | test"
        required: false
        default: "auto"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: scan-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scan-cache-${{ runner.os }}-

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_BATCH_SIZE: "8"
          SCAN_MAX_WORKERS: "2"
          SCAN_API_SOURCES: "VCI,TCBS"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "8"
          SCAN_SOURCE_USAGE_RATIO: "0.70"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.8"
          SCAN_REQUEST_JITTER_MAX_SEC: "3.0"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "60"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "180"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_DELAY_MIN_SEC: "3"
          SCAN_DELAY_MAX_SEC: "10"
          SESSION_RANDOM_START_MAX_SEC: "45"
          SESSION_FOCUS_LIMIT: "28"
          DRY_RUN: "0"
        run: python session_gate.py --mode "$SCAN_MODE"

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
            data/session_alerts_latest.json
            data/signal_tracker.json
            data/sector_rotation_history.json
            data/portfolio_threshold_state.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ThieucutooBot"
          git config user.email "bot@thieucutoo.local"
          git pull --rebase --autostash || true
          git add data/results_latest.json data/history_data.json data/historical_peaks.json data/failed_breaks.json data/session_alerts_latest.json data/signal_tracker.json data/sector_rotation_history.json data/portfolio_threshold_state.json data/notes.json data/portfolio.json || true
          if git diff --staged --quiet; then
            echo "No scanner data changes."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi