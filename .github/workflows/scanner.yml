name: Thieucutoo Scanner

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: thieucutoo-scanner-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || github.event.inputs.mode || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scanner.yml"
  schedule:
    # Start a little early; the runner waits inside session_gate.py for the exact Vietnam-time data windows.
    # Keep this workflow file touched without skip-ci when schedules need to be re-registered by GitHub.
    - cron: "31 3 * * 1-5" # morning broad: full scan from 10:31 VN, target before 11:15
    - cron: "40 6 * * 1-5" # afternoon split: 13:46 broad-nonfocus, 14:03 focus, target before 14:15
    - cron: "0 8 * * 1-5"  # eod: wait for 15:05 VN data
  workflow_dispatch:
    inputs:
      mode:
        description: "test | morning_broad | afternoon_split | eod | auto"
        required: false
        default: "test"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: scan-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scan-cache-${{ runner.os }}-

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_EVENT_NAME: ${{ github.event_name }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
          SCAN_BATCH_SIZE: "12"
          SCAN_MAX_WORKERS: "3"
          SCAN_API_SOURCES: "VCI,KBS,DNSE"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "15"
          SCAN_SOURCE_LIMITS: "VCI=20,KBS=20,DNSE=15"
          SCAN_SOURCE_USAGE_RATIO: "0.78"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.3"
          SCAN_REQUEST_JITTER_MAX_SEC: "1.5"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "30"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "90"
          SCAN_SOURCE_DISABLE_AFTER_FAILURES: "3"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_DELAY_MIN_SEC: "1"
          SCAN_DELAY_MAX_SEC: "4"
          SESSION_RANDOM_START_MAX_SEC: "45"
          SESSION_DATA_JITTER_MAX_SEC: "60"
          SESSION_FOCUS_LIMIT: "28"
          SESSION_QUICK_LIMIT: "40"
          SESSION_QUICK_SIGNAL_LIMIT: "30"
          SESSION_QUICK_NOTE_LIMIT: "10"
          SCAN_SKIP_NEAR_HIGH_WEEKDAY: "1"
          DRY_RUN: "0"
        run: |
          MODE="$SCAN_MODE"
          if [ "$SCAN_EVENT_NAME" = "push" ] && [ "$MODE" = "auto" ]; then
            echo "Workflow file push only refreshes GitHub schedule registration; scanner is skipped."
            exit 0
          fi
          if [ "$MODE" = "auto" ]; then
            case "$SCAN_SCHEDULE" in
              "31 3 * * 1-5") MODE="morning_broad" ;;
              "40 6 * * 1-5") MODE="afternoon_split" ;;
              "0 8 * * 1-5") MODE="eod" ;;
            esac
          fi
          if [ "$MODE" = "auto" ] && [ "$SCAN_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="test"
          fi
          if [ "$MODE" = "afternoon_split" ]; then
            export SESSION_FOCUS_LIMIT="24"
          fi
          echo "Running scanner mode=$MODE schedule=$SCAN_SCHEDULE"
          if [ "$SCAN_EVENT_NAME" = "schedule" ]; then
            NOW_VN="$(TZ=Asia/Ho_Chi_Minh date +%H%M)"
            NOW_VN_NUM=$((10#$NOW_VN))
            LIVE_MODE=""
            if [ "$NOW_VN_NUM" -ge 930 ] && [ "$NOW_VN_NUM" -le 1230 ]; then
              LIVE_MODE="morning_broad"
            elif [ "$NOW_VN_NUM" -ge 1330 ] && [ "$NOW_VN_NUM" -lt 1500 ]; then
              LIVE_MODE="afternoon_split"
            elif [ "$NOW_VN_NUM" -ge 1500 ] && [ "$NOW_VN_NUM" -le 2100 ]; then
              LIVE_MODE="eod"
            fi
            if [ -z "$LIVE_MODE" ]; then
              echo "Skip schedule at VN time $NOW_VN because market/report window is closed."
              exit 0
            fi
            if [ "$MODE" != "$LIVE_MODE" ]; then
              echo "Remap stale schedule mode=$MODE to live mode=$LIVE_MODE at VN time $NOW_VN."
              MODE="$LIVE_MODE"
            fi
          fi
          python session_gate_near_high.py --mode "$MODE"

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
            data/session_alerts_latest.json
            data/signal_tracker.json
            data/sector_rotation_history.json
            data/portfolio_threshold_state.json
            data/near_high_skiplist.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ThieucutooBot"
          git config user.email "bot@thieucutoo.local"
          git pull --rebase --autostash || true
          for path in \
            data/results_latest.json \
            data/session_alerts_latest.json \
            data/historical_peaks.json \
            data/failed_breaks.json \
            data/signal_tracker.json \
            data/sector_rotation_history.json \
            data/portfolio_threshold_state.json \
            data/near_high_skiplist.json \
            data/notes.json \
            data/portfolio.json
          do
            if [ -e "$path" ]; then
              if git check-ignore -q "$path"; then
                git add -f "$path"
              else
                git add "$path"
              fi
            fi
          done
          if git diff --staged --quiet; then
            echo "No scanner data changes."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi
