name: Thieucutoo Scanner

permissions:
  contents: write

concurrency:
  group: thieucutoo-scanner-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "1 3 * * 1-5"
    - cron: "31 6 * * 1-5"
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | morning | afternoon | eod | test"
        required: false
        default: "auto"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: thieucutoo-cache-${{ github.run_id }}
          restore-keys: |
            thieucutoo-cache-

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_BATCH_SIZE: "10"
          SCAN_MAX_WORKERS: "3"
          SCAN_DELAY_MIN_SEC: "3"
          SCAN_DELAY_MAX_SEC: "25"
          SCAN_RANDOM_START_MAX_SEC: "300"
          DRY_RUN: "0"
        run: python scan.py --mode "$SCAN_MODE"

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ThieucutooBot"
          git config user.email "bot@thieucutoo.local"
          git pull --rebase --autostash || true
          git add data/results_latest.json data/history_data.json data/historical_peaks.json data/failed_breaks.json data/notes.json data/portfolio.json || true
          if git diff --staged --quiet; then
            echo "No scanner data changes."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi
