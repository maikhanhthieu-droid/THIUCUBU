name: Thieucutoo Scanner

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: thieucutoo-scanner-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Start a little early; the runner waits inside session_gate.py for the exact Vietnam-time data windows.
    - cron: "28 3 * * 1-5" # morning: wait for 10:35 VN data + 0-4m jitter, report before 12:30 VN
    - cron: "31 6 * * 1-5" # afternoon: wait for 13:35 VN data + 0-4m jitter, report before 14:17 VN
    - cron: "0 8 * * 1-5"  # eod: wait for 15:05 VN data
  workflow_dispatch:
    inputs:
      mode:
        description: "test | morning | afternoon | eod | auto"
        required: false
        default: "test"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip uninstall vnstock3 -y || true
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: scan-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scan-cache-${{ runner.os }}-

      - name: Run scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SCAN_EVENT_NAME: ${{ github.event_name }}
          SCAN_SCHEDULE: ${{ github.event.schedule }}
          SCAN_BATCH_SIZE: "12"
          SCAN_MAX_WORKERS: "2"
          SCAN_API_SOURCES: "VCI,KBS"
          SCAN_SOURCE_REQUESTS_PER_MINUTE: "15"
          SCAN_SOURCE_LIMITS: "VCI=15,KBS=20"
          SCAN_SOURCE_USAGE_RATIO: "0.80"
          SCAN_REQUEST_JITTER_MIN_SEC: "0.3"
          SCAN_REQUEST_JITTER_MAX_SEC: "1.5"
          SCAN_SOURCE_ERROR_COOLDOWN_MIN_SEC: "30"
          SCAN_SOURCE_ERROR_COOLDOWN_MAX_SEC: "90"
          SCAN_FETCH_MAX_ATTEMPTS: "3"
          SCAN_DELAY_MIN_SEC: "1"
          SCAN_DELAY_MAX_SEC: "4"
          SESSION_RANDOM_START_MAX_SEC: "45"
          SESSION_DATA_JITTER_MAX_SEC: "60"
          SESSION_FOCUS_LIMIT: "28"
          SCAN_SKIP_NEAR_HIGH_WEEKDAY: "1"
          DRY_RUN: "0"
        run: |
          MODE="$SCAN_MODE"
          if [ "$MODE" = "auto" ]; then
            case "$SCAN_SCHEDULE" in
              "28 3 * * 1-5") MODE="morning" ;;
              "31 6 * * 1-5") MODE="afternoon" ;;
              "0 8 * * 1-5") MODE="eod" ;;
            esac
          fi
          if [ "$MODE" = "auto" ] && [ "$SCAN_EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="test"
          fi
          if [ "$MODE" = "afternoon" ]; then
            export SESSION_FOCUS_LIMIT="20"
          fi
          echo "Running scanner mode=$MODE schedule=$SCAN_SCHEDULE"
          python session_gate_near_high.py --mode "$MODE"

      - name: Upload data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thieucutoo-data-${{ github.run_number }}
          path: |
            data/results_latest.json
            data/history_data.json
            data/historical_peaks.json
            data/failed_breaks.json
            data/session_alerts_latest.json
            data/signal_tracker.json
            data/sector_rotation_history.json
            data/portfolio_threshold_state.json
            data/near_high_skiplist.json
          retention-days: 30

      - name: Commit scanner data
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "ThieucutooBot"
          git config user.email "bot@thieucutoo.local"
          git pull --rebase --autostash || true
          git add data/results_latest.json data/history_data.json data/historical_peaks.json data/failed_breaks.json data/session_alerts_latest.json data/signal_tracker.json data/sector_rotation_history.json data/portfolio_threshold_state.json data/near_high_skiplist.json data/notes.json data/portfolio.json || true
          if git diff --staged --quiet; then
            echo "No scanner data changes."
          else
            git commit -m "chore: update scanner data [skip ci]"
            git push
          fi